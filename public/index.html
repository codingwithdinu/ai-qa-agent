<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI QA Agent Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      height: 90vh;
    }

    .sidebar {
      background: #1e293b;
      border-radius: 8px;
      padding: 20px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      color: #10b981;
      margin-bottom: 10px;
      text-align: center;
    }

    .divider {
      height: 1px;
      background: #334155;
      margin: 10px 0;
    }

    .button {
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      text-align: center;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .button-primary {
      background: #10b981;
      color: #0f172a;
    }

    .button-primary:hover:not(:disabled) {
      background: #059669;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .button-secondary {
      background: #64748b;
      color: #0f172a;
    }

    .button-secondary:hover:not(:disabled) {
      background: #475569;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      animation: pulse 2s infinite;
    }

    .status-dot.running {
      background: #10b981;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .main-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .header {
      background: #1e293b;
      border-radius: 8px;
      padding: 20px;
      border: 1px solid #334155;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #10b981;
    }

    .header p {
      color: #94a3b8;
      font-size: 13px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: #10b981;
      transition: width 0.3s;
    }

    .artifacts {
      background: #1e293b;
      border-radius: 8px;
      padding: 20px;
      border: 1px solid #334155;
    }

    .artifacts h3 {
      margin-bottom: 15px;
      font-size: 14px;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .artifact-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .artifact-item {
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .artifact-item:hover {
      border-color: #10b981;
    }

    .artifact-item.available {
      color: #10b981;
      border-color: #10b981;
    }

    .artifact-item.available::before {
      content: '✓';
      font-weight: bold;
    }

    .artifact-item.unavailable {
      color: #64748b;
    }

    .artifact-item.unavailable::before {
      content: '◯';
    }

    .logs {
      background: #1e293b;
      border-radius: 8px;
      padding: 20px;
      border: 1px solid #334155;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .logs h3 {
      margin-bottom: 15px;
      font-size: 14px;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .log-console {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 15px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      overflow-y: auto;
      flex: 1;
      line-height: 1.5;
    }

    .log-entry {
      margin-bottom: 6px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .log-time {
      color: #64748b;
      min-width: 100px;
    }

    .log-level {
      min-width: 50px;
      font-weight: bold;
    }

    .log-level.info { color: #60a5fa; }
    .log-level.success { color: #10b981; }
    .log-level.warn { color: #f59e0b; }
    .log-level.error { color: #ef4444; }
    .log-level.debug { color: #8b5cf6; }

    .log-message {
      color: #e2e8f0;
      flex: 1;
      word-break: break-word;
    }

    .summary-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-radius: 8px;
      padding: 15px;
      border: 1px solid #334155;
      text-align: center;
    }

    .summary-card .number {
      font-size: 28px;
      font-weight: bold;
      color: #10b981;
      margin-bottom: 5px;
    }

    .summary-card .label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        max-height: 150px;
        overflow-x: auto;
        display: flex;
        flex-direction: row;
      }
    }
  </style>
  
</head>
<body>
  
  <div class="container">
    <div class="sidebar">
      <div class="logo">QA AGENT</div>
      <div class="divider"></div>
      
      <button class="button button-primary" onclick="runFullPipeline()">
        ▶ FULL PIPELINE
      </button>
      
      <button class="button button-secondary" onclick="startLogin()">
        🔐 LOGIN
      </button>
      
      <button id="recordBtn" class="button button-secondary">
        🎬 RECORD
      </button>
      
      <button class="button button-secondary" onclick="generateCases()">
        🧪 GENERATE
      </button>
      
      <button class="button button-secondary" onclick="runTests()">
        🏃 RUN TESTS
      </button>
      
      <button class="button button-secondary" onclick="generateReport()">
        📊 REPORT
      </button>

      <div class="divider"></div>
      
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <div>
          <div id="statusLabel">IDLE</div>
          <div id="statusMessage" style="font-size: 11px; color: #64748b;"></div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="header">
        <h1>AI QA Agent Dashboard</h1>
        <p>Automate your QA testing with AI-powered intelligence</p>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
      </div>

      <div class="artifacts">
        <h3>Artifacts</h3>
        <div class="artifact-grid">
          <div class="artifact-item unavailable" id="recordingArtifact" onclick="openArtifact('recordings')">
            <span>recording.json</span>
          </div>
          <div class="artifact-item unavailable" id="casesArtifact" onclick="openArtifact('cases')">
            <span>test-cases.json</span>
          </div>
          <div class="artifact-item unavailable" id="resultsArtifact" onclick="openArtifact('reports/results.json')">
            <span>results.json</span>
          </div>
          <div class="artifact-item unavailable" id="reportArtifact" onclick="openArtifact('reports/report.html')">
            <span>report.html</span>
          </div>
        </div>
      </div>

      <div class="logs">
        <h3>Live Log Stream</h3>
        <div class="log-console" id="logConsole"></div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>

</body>
</html>
